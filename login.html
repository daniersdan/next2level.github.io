<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portal | Next2Level</title>
  <link rel="icon" href="images/logo_page.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="assets/css/main.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-wrapper {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      padding: 24px;
    }

    .login-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-bottom: 32px;
      transition: color var(--transition);
    }

    .login-back:hover {
      color: var(--accent-cyan);
    }

    .login-card {
      padding: 48px 40px;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: var(--gradient-main);
    }

    /* Animated corner accents */
    .login-card::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 80px;
      height: 80px;
      background: radial-gradient(circle at 100% 100%, rgba(14,246,204,0.06) 0%, transparent 70%);
      pointer-events: none;
    }

    .login-header {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-logo {
      height: 36px;
      margin-bottom: 24px;
      opacity: 0.85;
    }

    .login-header h1 {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
    }

    .login-header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* Form fields */
    .login-form .field {
      position: relative;
      margin-bottom: 24px;
    }

    .login-form .field-icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 0.9rem;
      transition: color var(--transition);
      pointer-events: none;
      z-index: 2;
    }

    .login-form input[type="text"],
    .login-form input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      padding: 16px 16px 16px 48px;
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.95rem;
      transition: all var(--transition);
      outline: none;
    }

    .login-form input:focus {
      border-color: var(--accent-cyan);
      background: rgba(14,246,204,0.03);
      box-shadow: 0 0 20px rgba(14,246,204,0.05);
    }

    .login-form input:focus ~ .field-icon {
      color: var(--accent-cyan);
    }

    .login-form input::placeholder {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .login-form .field-line {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--gradient-main);
      transition: all var(--transition);
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
    }

    .login-form input:focus ~ .field-line {
      left: 0;
      width: 100%;
    }

    /* Password toggle */
    .toggle-password {
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
      padding: 4px;
      transition: color var(--transition);
      z-index: 2;
    }

    .toggle-password:hover {
      color: var(--accent-cyan);
    }

    /* Remember & Forgot */
    .login-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .remember-me input { display: none; }

    .remember-check {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
      background: rgba(255,255,255,0.04);
    }

    .remember-check i {
      font-size: 0.55rem;
      color: var(--bg-primary);
      opacity: 0;
      transform: scale(0);
      transition: all var(--transition);
    }

    .remember-me input:checked + .remember-check {
      background: var(--accent-cyan);
      border-color: var(--accent-cyan);
    }

    .remember-me input:checked + .remember-check i {
      opacity: 1;
      transform: scale(1);
    }

    .forgot-link {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .forgot-link:hover {
      color: var(--accent-cyan);
    }

    /* Submit button */
    .login-btn {
      width: 100%;
      padding: 16px;
      background: var(--gradient-main);
      color: var(--bg-primary);
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-heading);
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.2), transparent);
      opacity: 0;
      transition: opacity var(--transition);
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(14,246,204,0.3);
    }

    .login-btn:hover::before {
      opacity: 1;
    }

    .login-btn:active {
      transform: translateY(0);
    }

    /* Divider */
    .login-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 28px 0;
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .login-divider::before,
    .login-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }

    /* Social login */
    .social-login {
      display: flex;
      gap: 12px;
    }

    .social-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all var(--transition);
      text-decoration: none;
    }

    .social-btn:hover {
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
      color: #fff;
      transform: translateY(-2px);
    }

    .social-btn i {
      font-size: 1.1rem;
    }

    .social-btn.google i { color: #ea4335; }
    .social-btn.microsoft i { color: #00a4ef; }

    /* Footer text */
    .login-footer {
      text-align: center;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .login-footer p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    .login-footer a {
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Decorative grid behind card */
    .grid-pattern {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(14,246,204,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(14,246,204,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
      -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
    }

    /* Animations */
    .login-card { animation: fadeInUp 0.6s ease forwards; }
    .login-form .field:nth-child(1) { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.15s; opacity: 0; }
    .login-form .field:nth-child(2) { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.25s; opacity: 0; }
    .login-options { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.35s; opacity: 0; }
    .login-btn { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.45s; opacity: 0; }
    .login-divider { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.5s; opacity: 0; }
    .social-login { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.55s; opacity: 0; }
    .login-footer { animation: fadeInUp 0.5s ease forwards; animation-delay: 0.6s; opacity: 0; }

    @media (max-width: 500px) {
      .login-card { padding: 36px 24px; }
      .social-login { flex-direction: column; }
      .login-options { flex-direction: column; gap: 12px; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="grid-pattern"></div>

  <div class="login-wrapper">
    <a href="index.html" class="login-back">
      <i class="fas fa-arrow-left"></i> Volver al inicio
    </a>

    <div class="login-card glass-card">
      <div class="login-header">
        <img src="images/titulo.png" alt="Next2Level" class="login-logo" />
        <h1>Bienvenido</h1>
        <p>Accede al portal de clientes</p>
      </div>

      <form class="login-form" onsubmit="return false;">
        <div class="field">
          <input type="text" id="login-user" placeholder="Correo electrónico" autocomplete="email" />
          <i class="fas fa-envelope field-icon"></i>
          <div class="field-line"></div>
        </div>

        <div class="field">
          <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password" />
          <i class="fas fa-lock field-icon"></i>
          <button type="button" class="toggle-password" id="togglePass" aria-label="Mostrar contraseña">
            <i class="fas fa-eye"></i>
          </button>
          <div class="field-line"></div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span class="remember-check"><i class="fas fa-check"></i></span>
            Recordarme
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="login-btn">
          <span>Iniciar Sesión</span>
          <i class="fas fa-arrow-right"></i>
        </button>

        <div class="login-divider">o continúa con</div>

        <div class="social-login">
          <a href="#" class="social-btn google">
            <i class="fab fa-google"></i>
            Google
          </a>
          <a href="#" class="social-btn microsoft">
            <i class="fab fa-microsoft"></i>
            Microsoft
          </a>
        </div>
      </form>

      <div class="login-footer">
        <p>¿Aún no tienes cuenta? <a href="#">Solicitar acceso</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const toggleBtn = document.getElementById('togglePass');
    const passInput = document.getElementById('login-pass');

    toggleBtn.addEventListener('click', function () {
      const isPassword = passInput.type === 'password';
      passInput.type = isPassword ? 'text' : 'password';
      toggleBtn.querySelector('i').className = isPassword ? 'fas fa-eye-slash' : 'fas fa-eye';
    });
  </script>
</body>
</html>
